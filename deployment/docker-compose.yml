services:

  metastore:
    image: postgres:11
    hostname: metastore

    environment:
      POSTGRES_PASSWORD: jupyter

    volumes:
      - metastore:/var/lib/postgresql/data
      - ./metastore/ddl/init.sql:/docker-entrypoint-initdb.d/init.sql

    restart: always

    networks:
      sparknet:
        ipv4_address: 172.28.1.1


  master:
    build:
      context: ./master
    image: hadoop-hive-spark-master
    hostname: master

    depends_on:
      - metastore

    environment:
      SPARK_MASTER_HOST: master
      SPARK_LOCAL_IP: 172.28.1.2
      SPARK_LOCAL_HOSTNAME: master

    ports:
      - "4040:4040"
      - "7077:7077"
      - "8020:8020"
      - "8080:8080"
      - "8088:8088"
      - "9870:9870"
      - "10000:10000"

    volumes:
      - namenode:/opt/hadoop/dfs/name

      - ../processing:/home/jupyter/telepulse/processing
      - ../scripts:/home/jupyter/telepulse/scripts
      - ../data/uploads:/home/jupyter/telepulse/data/uploads

    restart: always

    networks:
      sparknet:
        ipv4_address: 172.28.1.2


  worker1:
    build:
      context: ./worker
    image: hadoop-hive-spark-worker
    hostname: worker1

    depends_on:
      - master

    environment:
      SPARK_MASTER_HOST: master
      SPARK_LOCAL_IP: 172.28.1.3
      SPARK_LOCAL_HOSTNAME: worker1

    ports:
      - "8042:8042"
      - "8081:8081"
      - "9864:9864"

    volumes:
      - datanode1:/opt/hadoop/dfs/data

    restart: always

    networks:
      sparknet:
        ipv4_address: 172.28.1.3


  worker2:
    build:
      context: ./worker
    image: hadoop-hive-spark-worker
    hostname: worker2

    depends_on:
      - master

    environment:
      SPARK_MASTER_HOST: master
      SPARK_LOCAL_IP: 172.28.1.4
      SPARK_LOCAL_HOSTNAME: worker2

    ports:
      - "8043:8042"
      - "8082:8081"
      - "9865:9864"

    volumes:
      - datanode2:/opt/hadoop/dfs/data

    restart: always

    networks:
      sparknet:
        ipv4_address: 172.28.1.4


  history:
    build:
      context: ./history
    image: hadoop-hive-spark-history
    hostname: history

    depends_on:
      - master
      - worker1
      - worker2

    environment:
      SPARK_MASTER_HOST: master
      SPARK_LOCAL_IP: 172.28.1.5
      SPARK_LOCAL_HOSTNAME: history

    ports:
      - "18080:18080"
      - "19888:19888"

    restart: always

    networks:
      sparknet:
        ipv4_address: 172.28.1.5


  api:
    build:
      context: ./api
    image: telepulse-api
    hostname: api

    ports:
      - "8000:8000"

    volumes:
      - ../api:/app
      - ../data/uploads:/data/uploads

    restart: unless-stopped

    networks:
      sparknet:


volumes:
  namenode:
  datanode1:
  datanode2:
  metastore:


networks:
  sparknet:
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16